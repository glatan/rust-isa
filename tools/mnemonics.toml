# Instruction mnemonics checked by tools/mnemonics.py.
#
# Add an arch to [targets] to enable the check for that arch. The triple and
# features are passed to llvm-mc. A [targets.<arch>.overrides.<family or
# extension>] table selects a different triple or feature set for that
# directory. Names that are intentionally not single mnemonics (family names,
# pseudo instructions, or LLVM gaps) go in [allow.<arch>] with a reason.

[targets.x86]
triple = "x86_64"
features = "+sse2,+avx,+avx2,+avx512f,+avx512bw,+avx512dq,+avx512vl,+fma,+f16c,+bmi,+bmi2,+popcnt,+lzcnt,+movbe,+adx,+rdrnd,+rdseed,+gfni,+vaes,+vpclmulqdq,+sha,+sm3,+sm4,+avx512vbmi,+avx512ifma,+avx512vnni,+avx512bf16,+avx512fp16,+avx512vpopcntdq,+avx512bitalg,+avx512vbmi2,+avx512vp2intersect,+avxifma,+avxneconvert,+avxvnni,+avxvnniint8,+avxvnniint16"

[targets.aarch64]
triple = "aarch64"
features = "+neon,+sve,+sme,+fp16,+dotprod,+i8mm,+bf16,+f32mm,+f64mm,+fcma,+fhm,+jsconv,+rdm,+crypto,+sha3,+sm4"

[targets.arm]
triple = "armv7"
features = "+neon,+i8mm,+dotprod"

[targets.arm.overrides.fp16]
triple = "armv8.2-a"
features = "+fp16,+neon"

[targets.arm.overrides.mve]
triple = "thumbv8.1m.main"
features = "+mve"

[targets.arm.overrides.mve_fp]
triple = "thumbv8.1m.main"
features = "+mve.fp"

[targets.arm.overrides.crypto]
triple = "armv8-a"
features = "+crypto,+sha2,+aes,+crc"

[targets.riscv]
triple = "riscv64"
features = "+v,+zba,+zbb,+zbc,+zbs,+zbkb,+zkn,+zks,+zfh,+zfa,+zvkn,+zvks,+zvkg,+zvbc"

[targets.s390x]
triple = "s390x"
features = "+vector,+vector-enhancements-1,+vector-enhancements-2,+vector-enhancements-3"

[targets.powerpc]
triple = "powerpc64le"
features = "+altivec,+vsx,+power8-vector,+power9-vector,+power10-vector,+power8-crypto,+mma"

[targets.loongarch]
triple = "loongarch64"
features = "+lsx,+lasx"

[targets.mips]
triple = "mips64"
features = "+msa"

[allow.s390x]
vle = "Family name; vleb, vleh, vlef, and vleg are the concrete instructions."

[allow.riscv]
"fmvh.x.d" = "Zfa move-high; semantic fallback: the RV64 C uses a shift."
"fmvp.d.x" = "Zfa move-pair; semantic fallback: the RV64 C uses shifts."
zip = "Zbkb zip is RV32-only; semantic fallback: the RV64 C uses a bit loop."
unzip = "Zbkb zip is RV32-only; semantic fallback: the RV64 C uses a bit loop."
"fcvtmod.w.h" = "Zfa convert; semantic fallback: the C truncates the low 32 bits."

[allow.aarch64]
extract = "Semantic lane extraction; the implementation selects a lane, not a single mnemonic."
replace = "Semantic lane replacement; the implementation selects a lane, not a single mnemonic."

[allow.loongarch]
"revw.d" = "Semantic word reversal; LLVM 23 does not list revw.d."
"vabs.w" = "Semantic absolute value; LSX has vabsd (absolute difference), not vabs."
"vabs.b" = "Semantic absolute value; LSX has vabsd (absolute difference), not vabs."
"vabs.h" = "Semantic absolute value; LSX has vabsd (absolute difference), not vabs."
"vabs.d" = "Semantic absolute value; LSX has vabsd (absolute difference), not vabs."
"vfcmp" = "Family; condition-specific wrappers are generated from the base form."
"xvabs.w" = "Semantic absolute value; LASX has xvabsd (absolute difference), not xvabs."
"xvabs.b" = "Semantic absolute value; LASX has xvabsd (absolute difference), not xvabs."
"xvabs.h" = "Semantic absolute value; LASX has xvabsd (absolute difference), not xvabs."
"xvabs.d" = "Semantic absolute value; LASX has xvabsd (absolute difference), not xvabs."
"xvfcmp" = "Family; condition-specific wrappers are generated from the base form."

[allow.x86]
vpcompressb = "LLVM 23 does not recognize this AVX10.1 mnemonic; the C uses the encoding."
vpcompressw = "LLVM 23 does not recognize this AVX10.1 mnemonic; the C uses the encoding."
vpexpandw = "LLVM 23 does not recognize this AVX10.1 mnemonic; the C uses the encoding."
