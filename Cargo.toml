[workspace]
resolver = "3"
members = [
  ".",
  "fixtures/aes-link",
  "fixtures/avx2-link",
  "fixtures/avx512f-link",
  "fixtures/avx512vl-link",
  "fixtures/fma-link",
  "fixtures/sse2-link",
  "fixtures/wasm-simd-link",
  "fixtures/wide-arithmetic-link",
  "fixtures/x86-zero-cost-link",
]

[package]
name = "rust-isa"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/glatan/rust-isa"
rust-version = "1.99.1"
description = "Architecture-specific ISA extensions for stable no_std Rust"

[features]
wide-arithmetic = []

[dependencies]

[profile.release]
lto = "thin"
panic = "abort"
